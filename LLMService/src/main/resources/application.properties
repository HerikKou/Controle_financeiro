spring.application.name=LLMService

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/llmdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=kafka:9092

# Consumer
spring.kafka.consumer.group-id=llm-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.financeiro.llm.dto.ExtratoAtualizadoDTO
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Claude API
claude.api.key=SUA_CHAVE_AQUI
claude.api.url=https://api.anthropic.com/v1/messages
claude.model=claude-sonnet-4-20250514

# Server
server.port=8083

# Logs
logging.level.org.springframework.kafka=INFO
logging.level.com.financeiro.llm=DEBUG

spring.kafka.listener.retry.topic.dlt-strategy=fail_on_error
spring.kafka.listener.retry.topic.suffix-strategy=suffix_with_index_value
